  push:
    paths:
      - config/gesture-diagnostics.conf
      - config/diagnostic-split-*.conf
      - build-diagnostics.yaml
      - .github/workflows/gesture-diagnostics.yml
jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix_path: build-diagnostics.yaml
      archive_name: gesture-diagnostics
